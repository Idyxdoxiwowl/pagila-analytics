version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    entrypoint:
      - sh
      - -c
      - |
        apk add tzdata >/dev/null 2>&1 || true
        cp /usr/share/zoneinfo/Asia/Almaty /etc/localtime
        echo "Asia/Almaty" > /etc/timezone
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --web.enable-lifecycle \
          --web.enable-admin-api
    networks:
      - monitoring
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    entrypoint:
      - sh
      - -c
      - |
        apk add tzdata >/dev/null 2>&1 || true
        cp /usr/share/zoneinfo/Asia/Almaty /etc/localtime
        echo "Asia/Almaty" > /etc/timezone
        exec /bin/node_exporter
    networks:
      - monitoring
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    restart: always
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:ayana@host.docker.internal:5432/pagila?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_DATABASES: "pagila"
      
  custom_exporter:
    image: python:3.12
    container_name: custom_exporter
    working_dir: /app
    volumes:
      - ./custom_exporter.py:/app/custom_exporter.py
    command: >
      sh -c "pip install prometheus_client requests && python custom_exporter.py"
    ports:
      - "8000:8000"
    networks:
      - monitoring
    restart: always


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Almaty
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:

volumes:
  prometheus_data:
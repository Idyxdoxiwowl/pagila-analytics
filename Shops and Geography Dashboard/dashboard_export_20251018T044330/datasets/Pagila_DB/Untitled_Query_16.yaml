sql: "SELECT\r\n    DATE_TRUNC('month', payment_date) AS month,\r\n    SUM(amount)\
  \ AS db_revenue,\r\n    SUM(\r\n        CASE\r\n            WHEN payment_date <\
  \ '2025-07-01' THEN amount * 0.85  -- \u0434\u043E \u0438\u044E\u043B\u044F 2024\
  \ CSV \"\u0435\u0441\u0442\u044C\" \u0438 \u0437\u0430\u043D\u0438\u0436\u0435\u043D\
  \u0430\r\n            ELSE NULL                                             -- \u043F\
  \u043E\u0441\u043B\u0435 \u0438\u044E\u043B\u044F 2024 CSV \u043D\u0435\u0442 (\u043E\
  \u0431\u0440\u044B\u0432\u0430\u0435\u0442\u0441\u044F)\r\n        END\r\n    )\
  \ AS csv_revenue\r\nFROM public.payment\r\nGROUP BY DATE_TRUNC('month', payment_date)\r\
  \nORDER BY month;\r\n"

sql: "SELECT a.first_name || ' ' || a.last_name AS actor, COUNT(fa.film_id) AS film_count\r\
  \nFROM actor a\r\nJOIN film_actor fa ON a.actor_id = fa.actor_id\r\nGROUP BY actor\r\
  \nORDER BY film_count DESC\r\nLIMIT 10;"
